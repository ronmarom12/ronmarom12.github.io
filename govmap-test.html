<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>GovMap API Test</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://www.govmap.gov.il/govmap/api/govmap.api.js"></script>

    <style>
        html, body {
            margin: 0;
            height: 100%;
        }

        #status {
            height: 50px;
            padding: 12px;
            box-sizing: border-box;
            font-family: Arial;
        }

        #map {
            height: calc(100% - 50px);
        }
    </style>
</head>

<body>

<div id="status">Starting GovMap test...</div>
<div id="map"></div>

<script>
$(document).ready(function () {

    const TOKEN = "PUT_YOUR_GOVMAP_TOKEN_HERE";

    govmap.createMap('map', {
        token: TOKEN,
        showXY: true,
        identifyOnClick: true,
        isEmbeddedToggle: false
    })
    .then(function () {
        document.getElementById("status").innerText =
            "SUCCESS - GovMap API token accepted.";
    })
    .catch(function (err) {
        document.getElementById("status").innerText =
            "FAILED - " + JSON.stringify(err);

        console.error(err);
    });

});
</script>

</body>
</html>
